name: Deploy to devnet (playground-template.dot)

# Publishes this template as `playground-template.dot` on the PCF products devnet:
#   1. build the Vite SPA  (npm run build -> dist/)
#   2. upload to devnet Bulletin + bind the DotNS name playground-template.dot
#
# Deploy CLI: @polkadot-community-foundation/polkadot-app-deploy@0.16.6, the release
# carrying the devnet DotNS v0.8.0 addresses. The playground-cli fork pins an older
# polkadot-app-deploy (pre-v0.6 DotNS set), so it can no longer bind devnet names;
# the playground Apps-grid publish stays out of this workflow until it is re-pinned.
#
# Signing account: secrets.MNEMONIC = the PCF deployer 5Fk8…, Bulletin-authorized on
# devnet and owner of playground-template.dot. --mnemonic = direct signer (never
# --suri, which rides the unauthorized upload pool).

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Day-2 redeploys: only when app content actually changes.
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "assets/**"
      - "polkadot-app-deploy.config.ts"
      - ".github/workflows/deploy-paseo-next.yml"

concurrency:
  # One signer (5Fk8) signs serially on-chain — never run two deploys at once.
  group: deploy-devnet-playground-template
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout playground-app-template
        uses: actions/checkout@v4

      - name: Guard — MNEMONIC must be set
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: |
          if [ -z "$MNEMONIC" ]; then
            echo "::error::secrets.MNEMONIC is not set. Add the 5Fk8 deployer mnemonic as a repo secret."
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install app deps
        run: npm ci

      - name: Build SPA
        run: npm run build # tsc -b && vite build -> ./dist (relative base, IPFS-ready)

      - name: Assert the bundle targets devnet
        run: |
          grep -raqi "d6eec26135305a8ad257a20d003357284c8aa03d0bdb2b357ab0a22371e11ef2" dist \
            || { echo "::error::devnet Asset Hub genesis not found in bundle"; exit 1; }
          echo "OK: bundle targets the devnet Asset Hub"

      - name: Install deploy tool
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.16.6

      - name: Deploy to devnet Bulletin + bind playground-template.dot
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: >
            polkadot-app-deploy
            --env devnet
            --mnemonic "$MNEMONIC"
            --config ./polkadot-app-deploy.config.ts
            --js-merkle
            --publish
            --no-transfer-to-signedin-user
            ./dist playground-template.dot
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
